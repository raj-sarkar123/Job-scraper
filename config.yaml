# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
  include_titles:
  # Core SDE / Software Engineering
  - '\bsoftware\s+(development\s+)?engineer\b'
  - '\bsde\b'
  - '\bsde\s*-?\s*(i{1,3}|[123])\b'
  - '\bsoftware\s+developer\b'
  - '\bassociate\s+(software\s+)?engineer\b'
  - '\bjunior\s+(software\s+)?engineer\b'
  - '\bgraduate\s+(software\s+)?engineer\b'
  - '\bapplication\s+engineer\b'
  - '\bproduct\s+engineer\b'
  - '\bmember\s+of\s+technical\s+staff\b'

  # Backend
  - '\bbackend\s+engineer\b'
  - '\bback-end\s+engineer\b'
  - '\bbackend\s+developer\b'
  - '\bback-end\s+developer\b'
  - '\bserver[-\s]?side\s+engineer\b'
  - '\bapi\s+engineer\b'
  - '\bapi\s+developer\b'
  - '\bnode\.?js\s+engineer\b'
  - '\bnode\.?js\s+developer\b'
  - '\bpython\s+engineer\b'
  - '\bpython\s+developer\b'

  # Full Stack
  - '\bfull[-\s]?stack\s+engineer\b'
  - '\bfull[-\s]?stack\s+developer\b'
  - '\bfull[-\s]?stack\s+software\s+engineer\b'
  - '\bweb\s+application\s+engineer\b'
  - '\bweb\s+software\s+engineer\b'

  # Cloud / Platform / DevOps
  - '\bplatform\s+engineer\b'
  - '\bcloud\s+engineer\b'
  - '\bdevops\s+engineer\b'
  - '\binfrastructure\s+engineer\b'
  - '\bsite\s+reliability\s+engineer\b'
  - '\bsre\b'

  # AI / GenAI
  - '\bai\s+engineer\b'
  - '\bai\s+software\s+engineer\b'
  - '\bgenerative\s+ai\s+engineer\b'
  - '\bgenai\s+engineer\b'
  - '\bllm\s+engineer\b'
  - '\bapplied\s+ai\s+engineer\b'
  - '\bmachine\s+learning\s+engineer\b'

  # SDET / QA / Test Automation
  - '\bsdet\b'
  - '\bsdet\s*(i{1,3}|[123])\b'
  - '\bsoftware\s+development\s+engineer\s+in\s+test\b'
  - '\bsoftware\s+engineer\s+in\s+test\b'
  - '\btest\s+engineer\b'
  - '\bsoftware\s+test\s+engineer\b'
  - '\bqa\s+engineer\b'
  - '\bquality\s+assurance\s+engineer\b'
  - '\bsoftware\s+qa\s+engineer\b'
  - '\bqa\s+automation\s+engineer\b'
  - '\btest\s+automation\s+engineer\b'
  - '\bautomation\s+test\s+engineer\b'
  - '\bautomation\s+engineer\b'
  - '\bquality\s+engineer\b'
  - '\bquality\s+engineering\b'
  - '\btest\s+automation\s+developer\b'
  - '\bqa\s+automation\s+developer\b'
  - '\bperformance\s+test\s+engineer\b'

exclude_titles:
  # Too senior
  - '\b(staff|principal|distinguished|fellow)\b'
  - '\bsenior\b'
  - '\blead\b'
  - '\barchitect\b'
  - '\b(director|vp|vice president|head of|chief|cto)\b'
  - '\b(manager|management)\b'

  # Non-technical roles
  - '\b(sales|account executive|marketing|recruit|recruiter|hr)\b'
  - '\b(customer support|technical support|customer success)\b'
  - '\baccount manager\b'

  # Unrelated data/business roles
  - '\b(data scientist|research scientist)\b'
  - '\bdata analyst\b'
  - '\b(business analyst|business intelligence)\b'
  - '\bproduct manager\b'

  # Unrelated engineering disciplines
  - '\b(civil|mechanical|electrical|chemical)\s+engineer\b'
  - '\bnetwork\s+administrator\b'
  - '\bsystem\s+administrator\b'

  # Mobile / gaming / design
  - '\b(ios|android|mobile|game)\s+(developer|engineer)\b'
  - '\b(game\s+developer|game\s+engineer)\b'
  - '\b(ui/?ux|ux|ui)\s+designer\b'

# Match against "<location> <title>", case-insensitive.
# India-wide + major Indian tech hubs + remote.
locations:
  - india
  - remote
  - work\s+from\s+home

  # West / South
  - bangalore
  - bengaluru
  - hyderabad
  - pune
  - mumbai
  - navi\s+mumbai
  - chennai
  - ahmedabad
  - surat
  - vadodara
  - indore
  - bhopal
  - nagpur
  - mysore
  - mysuru
  - mangalore
  - mangaluru
  - coimbatore
  - madurai
  - tiruchirappalli
  - kochi
  - calicut
  - kozhikode
  - thiruvananthapuram
  - trivandrum

  # Delhi NCR / North
  - delhi
  - new\s+delhi
  - gurgaon
  - gurugram
  - noida
  - greater\s+noida
  - faridabad
  - ghaziabad
  - chandigarh
  - mohali
  - jaipur
  - jodhpur
  - udaipur
  - dehradun
  - lucknow
  - kanpur
  - amritsar
  - jalandhar
  - ludhiana

  # East / Northeast
  - kolkata
  - newtown
  - new\s+town
  - howrah
  - bhubaneswar
  - patna
  - ranchi
  - guwahati

  # Central / other tech locations
  - raipur
  - vijayawada
  - visakhapatnam
  - pondicherry
  - puducherry

  # If true, anything reading as remote passes the location gate.
allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 7.0      # below this, no draft and no digest slot
max_per_digest: 5         # hard cap on expensive draft calls per run

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
